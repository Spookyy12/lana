{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Страница не найдена | Lana.by</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{% static 'shop/css/style.css' %}" rel="stylesheet">
    <style>
        body {
            background-color: #f4f6f9;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .error-code {
            font-size: 8rem;
            font-weight: 900;
            color: #ff4757;
            line-height: 1;
        }
        .yarn-ball {
            width: 150px;
            margin-bottom: 20px;
            animation: bounce 2s infinite;
        }
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {transform: translateY(0);}
            40% {transform: translateY(-20px);}
            60% {transform: translateY(-10px);}
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="{% static 'shop/img/logo.png' %}" alt="Клубок" class="yarn-ball">
        
        <div class="error-code">404</div>
        <h2 class="mb-3 fw-bold text-dark">Упс! Клубок закатился не туда...</h2>
        <p class="lead text-muted mb-4">
            Страница, которую вы ищете, была удалена, переименована или временно недоступна.
            <br>А может, её утащил кот?
        </p>
        
        <a href="/" class="btn btn-danger btn-lg rounded-pill px-5 shadow-sm">
            Вернуться на главную
        </a>
    </div>
</body>
</html>
