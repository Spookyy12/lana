{% extends "shop/base.html" %}
{% block content %}
<div class="container d-flex justify-content-center">
    <div class="card shadow-sm border-0 p-4" style="width: 400px;">
        <h3 class="mb-3 text-center">Вход</h3>
        <form method="post">
            {% csrf_token %}
            {% for field in form %}
            <div class="mb-3">
                <label class="form-label">{{ field.label }}</label>
                {{ field.errors }}
                <input type="{{ field.field.widget.input_type }}" name="{{ field.name }}" class="form-control">
            </div>
            {% endfor %}
            <button type="submit" class="btn btn-danger w-100">Войти</button>
        </form>
        <p class="mt-3 text-center">Нет аккаунта? <a href="{% url 'register' %}">Регистрация</a></p>
    </div>
</div>
{% endblock %}
